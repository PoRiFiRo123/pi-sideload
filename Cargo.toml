[package]
name = "pi-sideload"
version = "0.1.0"
edition = "2024"
description = "Headless iOS sideloading over Wi-Fi for a Raspberry Pi (isideload + idevice)"
license = "MIT"

[[bin]]
name = "pi-sideload"
path = "src/main.rs"

[dependencies]
isideload = { version = "0.5.2", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
idevice = { version = "0.1.61", default-features = false, features = ["usbmuxd", "tcp", "ring", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
rootcause = "*"

[profile.release]
strip = true
lto = "thin"
